name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  phpcs:
    name: Standard di codifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Predispone PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer

      - name: Installa le dipendenze
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Esegue PHPCS
        run: composer lint

  phpunit:
    name: Test (WordPress ${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Le versioni minime dichiarate nell'intestazione del plugin.
          - wp: "6.5"
            php: "8.1"
          # L'ultima stabile, per accorgersi delle rotture in anticipo.
          - wp: "latest"
            php: "8.3"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Predispone PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer

      - name: Installa le dipendenze
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Installa subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Prepara la suite di test di WordPress
        run: bin/installa-suite-test.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Procura il componente comune alla revisione fissata
        run: bin/installa-core.sh

      # Tre avvii separati e non uno: la versione dell'interfaccia del componente
      # comune la dichiara una costante, e una costante si definisce una volta sola
      # per processo. I tre ambienti non possono quindi convivere nella stessa
      # esecuzione.
      - name: Esegue PHPUnit, componente comune presente e compatibile
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test

      - name: Esegue PHPUnit, componente comune assente
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:senza-core

      - name: Esegue PHPUnit, versione di interfaccia incompatibile
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:core-incompatibile

  publiccode:
    name: Validazione publiccode.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Predispone Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Installa il validatore ufficiale
        run: go install github.com/italia/publiccode-parser-go/v5/publiccode-parser@latest

      - name: Valida la scheda
        run: publiccode-parser publiccode.yml
