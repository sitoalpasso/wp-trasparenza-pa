name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: Standard di codifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Predisponi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Installa le dipendenze
        uses: ramsey/composer-install@v3

      - name: Esegui PHPCS
        run: composer lint

  phpunit:
    name: Test (WordPress ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            php: '8.1'
          - wordpress: 'latest'
            php: '8.3'
    steps:
      - uses: actions/checkout@v5

      - name: Predisponi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Installa le dipendenze
        uses: ramsey/composer-install@v3

      - name: Predisponi Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Il componente dichiara "Requires Plugins: conformita-core", quindi non e
      # attivabile finche quel plugin non e installabile. I test caricano il file
      # principale dal bootstrap, percio la cartella si mappa senza attivare nulla.
      - name: Avvia l'ambiente di prova su WordPress corrente
        if: matrix.wordpress == 'latest'
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npx --yes @wordpress/env@latest start

      - name: Avvia l'ambiente di prova su WordPress ${{ matrix.wordpress }}
        if: matrix.wordpress != 'latest'
        env:
          WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npx --yes @wordpress/env@latest start

      - name: Esegui PHPUnit
        run: npx --yes @wordpress/env@latest run tests-cli --env-cwd=wp-content/plugins/trasparenza-pa vendor/bin/phpunit

  publiccode:
    name: Validazione publiccode.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Predisponi Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Installa il validatore ufficiale
        run: go install github.com/italia/publiccode-parser-go/v5/publiccode-parser@latest

      - name: Valida publiccode.yml
        run: publiccode-parser publiccode.yml
